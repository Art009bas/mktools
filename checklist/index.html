body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.6}

.progress-bar .info{font-size:.85rem;flex:1;min-width:120px}
.progress-bar .info strong{color:var(--text)}
.progress-bar .info span{color:var(--text2)}
.progress-track{flex:2;min-width:120px;height:8px;background:#f3f4f6;border-radius:100px;overflow:hidden}
.progress-fill{height:100%;background:var(--accent);border-radius:100px;transition:width .4s ease;width:0%}
.progress-pct{font-size:.85rem;font-weight:700;color:var(--accent);min-width:36px;text-align:right}

/* Category tabs */
.cat-tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:3px;margin-bottom:16px;overflow-x:auto}

.cat-tab.active{background:var(--accent);color:#fff}

.cat-tab:hover:not(.active){background:#f3f4f6}

.checklist-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}

.checklist-header .done-count{font-size:.8rem;color:var(--text2)}
.item{display:flex;align-items:flex-start;gap:12px;padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:6px;transition:all .15s;cursor:pointer;position:relative}
.item:hover{border-color:var(--accent)}
.item.done{opacity:.7;border-color:var(--border)}
.item.done .item-text{text-decoration:line-through;color:var(--text2)}
.item.done .item-check{background:var(--accent);border-color:var(--accent);color:#fff}
.item.done .item-check::after{content:'✓'}
.item-check{width:22px;height:22px;border:2px solid var(--border);border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;transition:all .12s;margin-top:1px;user-select:none}
.item-content{flex:1;min-width:0}
.item-text{font-size:.88rem;font-weight:500;transition:color .15s}
.item-desc{font-size:.75rem;color:var(--text2);margin-top:2px;line-height:1.4}
.item-tags{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.item-tag{padding:1px 8px;border-radius:4px;font-size:.65rem;font-weight:500;background:#f3f4f6;color:var(--text2)}
.item-tag.orange{background:var(--accent-light);color:var(--accent)}

.actions{display:flex;gap:8px;justify-content:center;margin-bottom:32px;flex-wrap:wrap}
.actions button{padding:8px 18px;border:none;border-radius:var(--radius-sm);font-size:.8rem;font-weight:500;cursor:pointer;transition:all .12s;font-family:var(--font)}
.btn-primary{background:var(--accent);color:#fff}

.btn-secondary{background:#f3f4f6;color:var(--text)}
.btn-secondary:hover{background:#e5e7eb}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text2)}

footer{border-top:1px solid var(--border);padding:32px 0;text-align:center;color:var(--text2);font-size:.85rem}

@media(max-width:640px){

const CATEGORIES = Object.keys(CHECKLISTS);
let activeCat = CATEGORIES[0];
let doneMap = {}; // {cat_idx: Set of item indices}

// Load from localStorage
try{
  const saved = localStorage.getItem('mkt_checklist');
  if(saved) doneMap = JSON.parse(saved);
}catch(e){}

function save(){
  try{localStorage.setItem('mkt_checklist', JSON.stringify(doneMap))}catch(e){}
}

function getKey(catIdx, itemIdx){return catIdx+'_'+itemIdx}

function isDone(catIdx, itemIdx){
  const key = getKey(catIdx, itemIdx);
  return doneMap[key] === true;
}

function toggle(catIdx, itemIdx){
  const key = getKey(catIdx, itemIdx);
  if(doneMap[key]) delete doneMap[key];
  else doneMap[key] = true;
  save();
  renderChecklist();
  updateProgress();
}

function addNote(catIdx, itemIdx, val){
  const key = 'note_'+catIdx+'_'+itemIdx;
  if(val) doneMap[key] = val;
  else delete doneMap[key];
  save();
}

function getNote(catIdx, itemIdx){
  return doneMap['note_'+catIdx+'_'+itemIdx] || '';
}

// Render categories tabs
function renderTabs(){
  const cont = document.getElementById('catTabs');
  cont.innerHTML = '';
  CATEGORIES.forEach((cat, i) => {
    const checklist = CHECKLISTS[cat];
    const done = checklist.items.filter((_, j) => isDone(i, j)).length;
    const total = checklist.items.length;
    const tab = document.createElement('button');
    tab.className = 'cat-tab' + (cat === activeCat ? ' active' : '');
    tab.innerHTML = checklist.icon + ' ' + checklist.name + ' <span class="count">' + done + '/' + total + '</span>';
    tab.onclick = () => { activeCat = cat; renderTabs(); renderChecklist(); };
    cont.appendChild(tab);
  });
}

// Render checklist
function renderChecklist(){
  const cont = document.getElementById('checklist');
  const catIdx = CATEGORIES.indexOf(activeCat);
  const checklist = CHECKLISTS[activeCat];
  
  cont.innerHTML = '';
  checklist.items.forEach((item, i) => {
    const done = isDone(catIdx, i);
    const note = getNote(catIdx, i);
    const div = document.createElement('div');
    div.className = 'item' + (done ? ' done' : '');
    
    div.innerHTML =
      '<div class="item-check"></div>' +
      '<div class="item-content">' +
        '<div class="item-text">' + item.text + '</div>' +
        (item.desc ? '<div class="item-desc">' + item.desc + '</div>' : '') +
        '<div class="item-note' + (note ? ' show' : '') + '" data-note="' + catIdx + '_' + i + '">' +
          '<textarea placeholder="Заметка..." onchange="addNote(' + catIdx + ',' + i + ',this.value)">' + escapeHtml(note) + '</textarea>' +
        '</div>' +
      '</div>';
    
    // Click to toggle
    div.querySelector('.item-check').onclick = (e) => { e.stopPropagation(); toggle(catIdx, i); };
    div.querySelector('.item-text').onclick = () => { toggle(catIdx, i); };
    div.querySelector('.item-desc').onclick = () => { toggle(catIdx, i); };
    
    // Double click for note
    div.ondblclick = () => {
      const noteEl = div.querySelector('.item-note');
      noteEl.classList.toggle('show');
      if(noteEl.classList.contains('show')) noteEl.querySelector('textarea').focus();
    };
    
    cont.appendChild(div);
  });
}

function updateProgress(){
  let totalDone = 0, totalAll = 0;
  CATEGORIES.forEach((cat, i) => {
    const items = CHECKLISTS[cat].items;
    items.forEach((_, j) => {
      totalAll++;
      if(isDone(i, j)) totalDone++;
    });
  });
  
  document.getElementById('doneTotal').textContent = totalDone;
  document.getElementById('totalItems').textContent = totalAll;
  const pct = totalAll > 0 ? Math.round(totalDone/totalAll*100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressPct').textContent = pct + '%';
}

// Actions
document.getElementById('resetDoneBtn').onclick = () => {
  if(!confirm('Сбросить все выполненные пункты?')) return;
  CATEGORIES.forEach((cat, i) => {
    CHECKLISTS[cat].items.forEach((_, j) => {
      delete doneMap[getKey(i, j)];
    });
  });
  save(); renderTabs(); renderChecklist(); updateProgress();
};

document.getElementById('resetAllBtn').onclick = () => {
  if(!confirm('Сбросить ВСЁ, включая заметки?')) return;
  doneMap = {};
  save(); renderTabs(); renderChecklist(); updateProgress();
};

document.getElementById('exportBtn').onclick = () => {
  let text = '✅ Чек-лист маркетолога\n';
  text += 'Дата: ' + new Date().toLocaleDateString('ru-RU') + '\n\n';
  
  CATEGORIES.forEach((cat, i) => {
    const checklist = CHECKLISTS[cat];
    const done = checklist.items.filter((_, j) => isDone(i, j)).length;
    text += '─── ' + checklist.name + ' (' + done + '/' + checklist.items.length + ') ───\n';
    checklist.items.forEach((item, j) => {
      const d = isDone(i, j);
      text += (d ? '✅' : '⬜') + ' ' + item.text + '\n';
      const note = getNote(i, j);
      if(note) text += '   📝 ' + note + '\n';
    });
    text += '\n';
  });
  
  const totalDone = Object.keys(doneMap).filter(k => k.startsWith('note_') ? false : doneMap[k]).length;
  text += 'Итого: ' + totalDone + '/' + 
    CATEGORIES.reduce((s,c) => s + CHECKLISTS[c].items.length, 0) + '\n';
  
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('exportBtn');
    btn.textContent = '✅ Скопировано!';
    setTimeout(() => btn.textContent = '📋 Экспорт', 1500);
  });
};

function escapeHtml(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

// Init
renderTabs();
renderChecklist();
updateProgress();
</script>
