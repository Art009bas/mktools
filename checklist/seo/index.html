<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f8f9fb;--surface:#fff;--text:#1a1a2e;--text2:#6b7280;--accent:#f97316;--accent-hover:#ea580c;--accent-light:#fff7ed;--border:#e5e7eb;--radius:16px;--radius-sm:8px;--font:'Inter',system-ui,-apple-system,sans-serif}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.6}

.logo{font-weight:800;font-size:1.2rem;color:var(--text);text-decoration:none}

.hero p{color:var(--text2);font-size:.85rem;max-width:600px;margin:0 auto}
.hero .sub{font-size:.78rem;color:var(--text2);margin-top:4px}
.breadcrumbs{font-size:.8rem;color:var(--text2);margin-bottom:8px;text-align:left}
.breadcrumbs a{color:var(--text2);text-decoration:none}
.breadcrumbs a:hover{color:var(--accent)}
.breadcrumbs span{margin:0 4px;color:var(--text2)}
.progress-bar{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 18px;margin-bottom:14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.progress-bar .info{font-size:.82rem;flex:1;min-width:120px}
.progress-bar .info strong{color:var(--text)}
.progress-bar .info span{color:var(--text2)}
.progress-track{flex:2;min-width:120px;height:8px;background:#f3f4f6;border-radius:100px;overflow:hidden}
.progress-fill{height:100%;background:var(--accent);border-radius:100px;transition:width .4s ease;width:0%}
.progress-pct{font-size:.82rem;font-weight:700;color:var(--accent);min-width:36px;text-align:right}
.checklist{margin-bottom:24px}
.item{display:flex;align-items:flex-start;gap:10px;padding:9px 12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:5px;transition:all .12s;cursor:pointer}
.item:hover{border-color:var(--accent)}
.item.done{opacity:.65;border-color:var(--border)}
.item.done .item-text{text-decoration:line-through;color:var(--text2)}
.item.done .item-check{background:var(--accent);border-color:var(--accent);color:#fff}
.item.done .item-check::after{content:'✓'}
.item-check{width:20px;height:20px;border:2px solid var(--border);border-radius:5px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;transition:all .12s;margin-top:1px}
.item-content{flex:1;min-width:0}
.item-text{font-size:.85rem;font-weight:500}
.item-desc{font-size:.73rem;color:var(--text2);margin-top:1px}
.actions{display:flex;gap:8px;justify-content:center;margin-bottom:28px;flex-wrap:wrap}
.actions button{padding:7px 16px;border:none;border-radius:var(--radius-sm);font-size:.78rem;font-weight:500;cursor:pointer;transition:all .12s;font-family:var(--font)}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-hover)}
.btn-secondary{background:#f3f4f6;color:var(--text)}
.btn-secondary:hover{background:#e5e7eb}
footer{border-top:1px solid var(--border);padding:28px 0;text-align:center;color:var(--text2);font-size:.82rem}
footer a{color:var(--accent)}

<script>
const ITEMS=[
{text:'Проверены мета-теги (title, description)',desc:'Уникальность, длина, ключевые слова'},
{text:'Структура заголовков H1-H6',desc:'Один H1 на страницу, иерархия'},
{text:'Проверена скорость загрузки',desc:'Core Web Vitals, мобильная версия'},
{text:'Настроены ЧПУ (человеко-понятные URL)',desc:'Транслит, без параметров, короткие'},
{text:'Проверен файл robots.txt',desc:'Закрыты служебные страницы'},
{text:'Создана/обновлена sitemap.xml',desc:'Все значимые страницы, даты обновления'},
{text:'Проверены битые ссылки',desc:'Внутренние и внешние'},
{text:'Оптимизированы изображения',desc:'Alt-теги, размер, формат WebP'},
{text:'Проверен мобильный вид',desc:'Адаптивность, скорость на 3G'},
{text:'Канонические URL',desc:'Нет дублей, rel=canonical настроен'},
{text:'Микроразметка (Schema.org)',desc:'Organization, LocalBusiness, FAQ, Article'},
{text:'Анализ конкурентов по ключевым словам',desc:'Позиции, семантика, пробелы'}
];
const K='mkt_chk_seo';let m={};
try{const s=localStorage.getItem(K);if(s)m=JSON.parse(s)}catch(e){}
function sv(){try{localStorage.setItem(K,JSON.stringify(m))}catch(e){}}
function tg(i){if(m[i])delete m[i];else m[i]=true;sv();r();u()}
function r(){const c=document.getElementById('checklist');c.innerHTML='';ITEMS.forEach((it,i)=>{const d=!!m[i];const di=document.createElement('div');di.className='item'+(d?' done':'');di.innerHTML='<div class="item-check"></div><div class="item-content"><div class="item-text">'+it.text+'</div>'+(it.desc?'<div class="item-desc">'+it.desc+'</div>':'')+'</div>';di.querySelector('.item-check').onclick=(e)=>{e.stopPropagation();tg(i)};di.querySelector('.item-text').onclick=()=>tg(i);if(it.desc)di.querySelector('.item-desc').onclick=()=>tg(i);c.appendChild(di)})}
function u(){let td=0;ITEMS.forEach((_,i)=>{if(m[i])td++});document.getElementById('doneTotal').textContent=td;const p=Math.round(td/12*100);document.getElementById('progressFill').style.width=p+'%';document.getElementById('progressPct').textContent=p+'%'}
document.getElementById('resetBtn').onclick=()=>{if(!confirm('Сбросить всё?'))return;m={};sv();r();u()};
document.getElementById('exportBtn').onclick=()=>{let t='🔍 SEO-аудит\n'+new Date().toLocaleDateString('ru-RU')+'\n\n';ITEMS.forEach((it,i)=>{t+=(m[i]?'✅':'⬜')+' '+it.text+'\n'});t+='\nИтого: '+Object.keys(m).length+'/12';navigator.clipboard.writeText(t).then(()=>{const b=document.getElementById('exportBtn');b.textContent='✅ Скопировано!';setTimeout(()=>b.textContent='📋 Копировать отчёт',1500)})};
r();u();
</script>
