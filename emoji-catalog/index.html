<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Каталог эмодзи — mktools</title>
  <meta name="description" content="Полный каталог эмодзи с поиском, категориями, историей копирования. Копируй и вставляй одним кликом.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8f9fb; --surface: #fff; --text: #1a1a2e;
      --text-secondary: #6b7280; --text-tertiary: #9ca3af;
      --accent: #f97316; --accent-hover: #ea580c;
      --border: #e5e7eb;
      --radius: 16px; --radius-sm: 8px;
      --font: 'Inter', system-ui, -apple-system, sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; }
    header {
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 16px 24px; position: sticky; top: 0; z-index: 100;
    }
    .header-inner { max-width: 960px; margin: 0 auto; display: flex; align-items: center; gap: 16px; }
    .logo { font-weight: 800; font-size: 1.2rem; text-decoration: none; color: var(--text); }
    .logo span { color: var(--accent); }
    .back-link { color: var(--text-secondary); text-decoration: none; font-size: 0.9rem; margin-left: auto; }
    .back-link:hover { color: var(--accent); }
    .app { max-width: 960px; margin: 0 auto; padding: 32px 24px 80px; }
    h1 { font-size: 1.75rem; font-weight: 800; margin-bottom: 4px; }
    .subtitle { color: var(--text-secondary); margin-bottom: 24px; font-size: 0.95rem; }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 24px; margin-bottom: 16px;
    }

    /* Поиск */
    .search-wrap {
      position: relative; margin-bottom: 16px;
    }
    .search-wrap input {
      font-family: var(--font); width: 100%; padding: 12px 16px 12px 44px;
      border: 1.5px solid var(--border); border-radius: var(--radius-sm);
      font-size: 1rem; outline: none; transition: border-color 0.2s;
      background: var(--bg);
    }
    .search-wrap input:focus { border-color: var(--accent); background: var(--surface); }
    .search-wrap .icon {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      font-size: 1.1rem; color: var(--text-tertiary); pointer-events: none;
    }
    .search-wrap .clear-search {
      position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
      background: none; border: none; font-size: 1.2rem; cursor: pointer;
      color: var(--text-tertiary); padding: 8px; display: none;
    }
    .search-wrap .clear-search:hover { color: var(--text); }

    /* Категории */
    .categories-wrap {
      display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px;
      margin-bottom: 16px; scrollbar-width: thin;
    }
    .cat-btn {
      white-space: nowrap; padding: 8px 16px; border-radius: 20px;
      border: 1.5px solid var(--border); background: var(--surface);
      font-family: var(--font); font-size: 0.85rem; font-weight: 500;
      cursor: pointer; transition: all 0.2s; color: var(--text-secondary);
      flex-shrink: 0;
    }
    .cat-btn:hover { border-color: var(--accent); color: var(--text); }
    .cat-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    /* Сетка эмодзи */
    .emoji-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr));
      gap: 8px; margin-bottom: 16px;
    }
    .emoji-item {
      display: flex; align-items: center; justify-content: center;
      width: 100%; aspect-ratio: 1;
      font-size: 1.6rem; border-radius: var(--radius-sm);
      border: 1px solid var(--border); background: var(--surface);
      cursor: pointer; transition: all 0.15s; user-select: none;
    }
    .emoji-item:hover { border-color: var(--accent); transform: scale(1.15); z-index: 2; position: relative; }
    .emoji-item.copied {
      background: var(--accent); color: #fff; border-color: var(--accent); animation: pop 0.2s ease;
    }
    @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.3); } 100% { transform: scale(1); } }

    /* Результаты поиска */
    .search-section { display: none; }
    .section-title {
      font-size: 0.85rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.05em; color: var(--text-tertiary); margin-bottom: 12px;
    }

    /* История */
    .history-section { display: none; }
    .history-list {
      display: flex; flex-wrap: wrap; gap: 6px; min-height: 40px;
    }
    .history-item {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 6px 12px; border-radius: 20px;
      border: 1px solid var(--border); font-size: 1rem;
      cursor: pointer; transition: all 0.15s;
    }
    .history-item:hover { border-color: var(--accent); }
    .history-item .remove {
      cursor: pointer; font-size: 0.8rem; color: var(--text-tertiary);
      margin-left: 4px; line-height: 1;
    }
    .history-item .remove:hover { color: var(--text); }

    .empty-state {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 48px 24px; color: var(--text-tertiary); text-align: center;
    }
    .empty-state .big { font-size: 3rem; margin-bottom: 12px; }

    .toast {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--text); color: #fff; padding: 10px 20px;
      border-radius: var(--radius-sm); font-size: 0.9rem; font-weight: 500;
      opacity: 0; transition: all 0.3s; z-index: 1000; pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (max-width: 640px) {
      .app { padding: 20px 16px 60px; }
      h1 { font-size: 1.4rem; }
      .emoji-grid { grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 6px; }
      .emoji-item { font-size: 1.3rem; }
    }
  </style>
</head>

<header>

</div>

<div class="toast" id="toast"></div>

var CATEGORIES = Object.keys(EMOJIS);

// ========== СОСТОЯНИЕ ==========
var emojiHistory = JSON.parse(localStorage.getItem('emojiHistory') || '[]');

// ========== ЗАГРУЗКА ==========
document.addEventListener('DOMContentLoaded', function() {
  renderCategories();
  renderCategory(0);
  renderHistory();
});

// ========== КАТЕГОРИИ ==========
function renderCategories() {
  var wrap = document.getElementById('categories');
  wrap.innerHTML = '';
  CATEGORIES.forEach(function(cat, i) {
    var btn = document.createElement('button');
    btn.className = 'cat-btn' + (i === 0 ? ' active' : '');
    btn.textContent = cat;
    btn.onclick = function() { selectCategory(i, btn); };
    wrap.appendChild(btn);
  });
}

function selectCategory(idx, btn) {
  document.querySelectorAll('.cat-btn').forEach(function(b) { b.classList.remove('active'); });
  if (btn) btn.classList.add('active');
  renderCategory(idx);
  hideSearch();
}

function renderCategory(idx) {
  var cat = CATEGORIES[idx];
  if (!cat) return;
  document.getElementById('currentCatTitle').textContent = cat;
  renderGrid(EMOJIS[cat], 'emojiGrid');
}

function renderGrid(emojis, gridId) {
  var grid = document.getElementById(gridId);
  grid.innerHTML = '';
  emojis.forEach(function(e) {
    var item = document.createElement('div');
    item.className = 'emoji-item';
    item.textContent = e;
    item.title = getEmojiName(e);
    item.onclick = function() { copyEmoji(e, item); };
    grid.appendChild(item);
  });
}

// ========== ПОИСК ==========
function onSearch() {
  var q = document.getElementById('searchInput').value.trim().toLowerCase();
  document.getElementById('clearBtn').style.display = q ? 'block' : 'none';
  if (!q) {
    hideSearch();
    return;
  }
  document.getElementById('searchSection').style.display = 'block';
  document.getElementById('currentCatTitle').textContent = '🙂 Смайлики';
  
  var results = [];
  for (var emoji in EMOJI_NAMES) {
    if (EMOJI_NAMES[emoji].indexOf(q) !== -1) {
      results.push(emoji);
    }
  }
  // Также ищем в emoji
  for (var emoji in EMOJI_NAMES) {
    if (results.indexOf(emoji) === -1 && emoji.indexOf(q) !== -1) {
      results.push(emoji);
    }
  }
  renderSearchResults(results);
}

function renderSearchResults(results) {
  var grid = document.getElementById('searchGrid');
  grid.innerHTML = '';
  results.forEach(function(e) {
    var item = document.createElement('div');
    item.className = 'emoji-item';
    item.textContent = e;
    item.title = getEmojiName(e);
    item.onclick = function() { copyEmoji(e, item); };
    grid.appendChild(item);
  });
  if (!results.length) {
    grid.innerHTML = '<div class="empty-state"><div class="big">🔍</div><p>Ничего не найдено</p></div>';
  }
}

function hideSearch() {
  document.getElementById('searchSection').style.display = 'none';
  document.getElementById('searchInput').value = '';
  document.getElementById('clearBtn').style.display = 'none';
}

function clearSearch() {
  document.getElementById('searchInput').value = '';
  hideSearch();
}

// ========== КОПИРОВАНИЕ ==========
function copyEmoji(emoji, el) {
  navigator.clipboard.writeText(emoji).then(function() {
    el.classList.add('copied');
    setTimeout(function() { el.classList.remove('copied'); }, 300);
    addToHistory(emoji);
    showToast('Скопировано: ' + emoji);
  }).catch(function() {
    // fallback
    var ta = document.createElement('textarea');
    ta.value = emoji;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('Скопировано: ' + emoji);
    addToHistory(emoji);
  });
}

// ========== ИСТОРИЯ ==========
function addToHistory(emoji) {
  emojiHistory = emojiHistory.filter(function(e) { return e !== emoji; });
  emojiHistory.unshift(emoji);
  if (emojiHistory.length > 30) history = emojiHistory.slice(0, 30);
  localStorage.setItem('emojiHistory', JSON.stringify(emojiHistory));
  renderHistory();
}

function removeFromHistory(emoji) {
  emojiHistory = emojiHistory.filter(function(e) { return e !== emoji; });
  localStorage.setItem('emojiHistory', JSON.stringify(emojiHistory));
  renderHistory();
}

function renderHistory() {
  var section = document.getElementById('historySection');
  var list = document.getElementById('historyList');
  section.style.display = emojiHistory.length ? 'block' : 'none';
  list.innerHTML = '';
  emojiHistory.forEach(function(e) {
    var item = document.createElement('span');
    item.className = 'history-item';
    item.innerHTML = e + ' <span class="remove" onclick="event.stopPropagation();removeFromHistory(\'' + e + '\')">✕</span>';
    item.title = getEmojiName(e);
    item.onclick = function() { copyEmoji(e, item); };
    list.appendChild(item);
  });
}

// ========== УТИЛИТЫ ==========
function getEmojiName(emoji) {
  return EMOJI_NAMES[emoji] || '';
}

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 2000);
}
</script>
