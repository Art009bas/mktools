<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f8f9fb;--surface:#fff;--text:#111827;--text2:#6b7280;--accent:#f97316;--accent-hover:#ea580c;--accent-light:#fff7ed;--border:#e5e7eb;--radius:16px;--radius-sm:8px;--font:'Inter',system-ui,-apple-system,sans-serif}
body{font-family:var(--font);background:var(--bg);color:var(--text)}
.container{max-width:1200px;margin:0 auto;padding:0 20px}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 0;position:sticky;top:0;z-index:100}
header .container{display:flex;align-items:center;justify-content:space-between}
.logo{font-weight:800;font-size:1.1rem;color:var(--text);text-decoration:none}
.logo span{color:var(--accent)}
.back{color:var(--text2);text-decoration:none;font-size:.85rem}
.back:hover{color:var(--accent)}
.hero{padding:24px 0 14px;text-align:center}
.hero p{color:var(--text2);font-size:.82rem}

.toolbar{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px;margin-bottom:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toolbar button{padding:6px 14px;border:none;border-radius:6px;font-size:.78rem;font-weight:500;cursor:pointer;font-family:var(--font);display:flex;align-items:center;gap:5px;white-space:nowrap}
.btn-p{background:var(--accent);color:#fff}
.btn-p:hover{background:var(--accent-hover)}
.btn-s{background:#f3f4f6;color:var(--text)}
.btn-s:hover{background:#e5e7eb}
.btn-o{background:transparent;border:1px solid var(--border);color:var(--text2)}
.btn-o:hover{border-color:var(--accent);color:var(--accent)}
.sep{width:1px;height:24px;background:var(--border)}

.roadmap-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.meta-bar{display:flex;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap;align-items:center}
.meta-bar input{padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-size:.82rem;font-family:var(--font);background:var(--surface);color:var(--text);flex:1;min-width:140px}
.meta-bar input:focus{outline:none;border-color:var(--accent)}
.meta-bar .hint{font-size:.72rem;color:var(--text2);white-space:nowrap}
.meta-bar select{padding:4px 6px;border:1px solid var(--border);border-radius:4px;font-size:.75rem;font-family:var(--font);background:var(--surface);color:var(--text)}

/* Inline form */
.form-bar{display:flex;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border);flex-wrap:wrap;align-items:center}
.form-bar input,.form-bar select{padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:.82rem;font-family:var(--font);background:var(--bg);color:var(--text)}
.form-bar input:focus,.form-bar select:focus{outline:none;border-color:var(--accent)}
.fn{flex:1;min-width:140px}
.fs{width:100px}
.fm{width:130px}

/* Grid container — single source of truth */
.grid-wrap{overflow-x:auto;position:relative}
.grid-body{position:relative}
.grid-header{position:relative;height:48px}
.grid-months{position:absolute;top:0;left:0;right:0;height:26px;display:flex}
.grid-month{font-size:.7rem;font-weight:600;color:var(--text2);text-align:center;padding-top:6px;border-left:1px solid var(--border);height:100%}
.grid-weeks{position:absolute;bottom:0;left:0;right:0;height:22px;display:flex}
.grid-week{font-size:.6rem;color:#ccc;text-align:center;border-left:1px solid var(--border);height:100%;padding-top:4px;display:flex;align-items:center;justify-content:center}
.grid-week.odd{color:var(--text2)}
.grid-rows{position:relative}
.grid-row{position:relative;height:44px;border-bottom:1px solid var(--border)}
.grid-row:nth-child(even){background:rgba(0,0,0,.012)}
.grid-row-highlight{position:absolute;inset:0;background:var(--accent-light);opacity:0;pointer-events:none;transition:opacity .1s}
.grid-row.selected .grid-row-highlight{opacity:1}
.grid-lines{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none}
.grid-line{border-left:1px solid #f3f4f6;position:absolute;top:0;bottom:0}
.grid-line.thick{border-left-color:var(--border)}

/* Task label embedded in row */
/* (task-label removed) */

/* Task bar — positioned in pixels */
.task-bar{position:absolute;height:26px;top:9px;border-radius:6px;cursor:pointer;display:flex;align-items:center;padding:0 8px;font-size:.68rem;font-weight:600;color:#fff;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;z-index:5;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.task-bar:hover{z-index:10;box-shadow:0 4px 12px rgba(0,0,0,.2);transform:translateY(-1px)}
.task-bar.s-done{background:#059669}
.task-bar.s-inprogress{background:#f97316}
.task-bar.s-plan{background:#6366f1}
.task-bar.s-paused{background:#9ca3af}
.task-bar.s-canceled{background:#ef4444}
.task-bar.empty{opacity:.4}

/* Legend */
.legend-bar{display:flex;gap:14px;padding:8px 14px;border-top:1px solid var(--border);flex-wrap:wrap;font-size:.72rem;color:var(--text2);align-items:center}
.legend-item{display:flex;align-items:center;gap:5px}
.legend-item .sw{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.stats{font-size:.72rem;color:var(--text2);margin-left:auto;display:flex;gap:8px}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;display:flex;align-items:center;justify-content:center}
.modal{background:var(--surface);border-radius:var(--radius);padding:24px;width:400px;max-width:92vw}
.modal h2{font-size:1rem;margin-bottom:14px}
.modal .mg{margin-bottom:8px}
.modal .mg label{display:block;font-size:.75rem;color:var(--text2);margin-bottom:3px}
.modal .mg input,.modal .mg select,.modal .mg textarea{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:.82rem;font-family:var(--font);background:var(--bg);color:var(--text)}
.modal .mg textarea{resize:vertical;min-height:50px}
.modal .actions{display:flex;gap:8px;margin-top:12px}
.modal .actions button{padding:7px 18px;border:none;border-radius:6px;font-size:.82rem;font-weight:500;cursor:pointer;font-family:var(--font)}

footer{padding:24px 0;text-align:center;color:var(--text2);font-size:.8rem;margin-top:24px}
</style>

<script>
// ── Constants ──
const MON = ['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];
const SC = {done:'#059669',inprogress:'#f97316',plan:'#6366f1',paused:'#9ca3af',canceled:'#ef4444'};
const SL = {done:'Выполнено',inprogress:'В работе',plan:'В плане',paused:'На паузе',canceled:'Отменено'};
const D7 = 7*86400000;
let tasks = [], sel = -1, ed = -1;

// ── Time helpers ──
function startDate(){
  const d = new Date();
  // Monday of current week
  const day = d.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  return new Date(d.getFullYear(), d.getMonth(), d.getDate() + diff);
}

function weekInfo(){
  const s = startDate();
  const w = parseInt(document.getElementById('zoomSel').value) || 26;
  const pw = 40; // px per week
  const tw = w * pw;
  return {s, w, pw, tw};
}

// ── Fill select ──
function fillSel(el, s){
  const {s:start, w} = weekInfo();
  el.innerHTML = '';
  for(let i=0;i<w;i++){
    const d = new Date(start.getTime() + i*D7);
    const opt = document.createElement('option');
    opt.value = i;
    const wk = Math.floor(i/4) + 1;
    opt.textContent = MON[d.getMonth()] + ' д.' + d.getDate() + ' (нед ' + (i%4+1) + ')';
    el.appendChild(opt);
  }
  if(s!==undefined && s>=0 && s<w) el.value = s;
}

// ── Render ──
function render(){
  const {s:start, w, pw, tw} = weekInfo();
  
  // ── Header: months → 4-week blocks ──
  const hdr = document.getElementById('gridHeader');
  let mHtml = '<div class="grid-months" style="width:'+tw+'px">';
  let wHtml = '<div class="grid-weeks" style="width:'+tw+'px">';
  
  for(let i=0;i<w;i++){
    const d = new Date(start.getTime() + i*D7 + D7/2);
    // Month label — only first week of each month
    if(i===0 || d.getMonth() !== new Date(start.getTime() + (i-1)*D7 + D7/2).getMonth()){
      // Count weeks until next month change
      let span = 1;
      for(let j=i+1;j<w;j++){
        const dj = new Date(start.getTime() + j*D7 + D7/2);
        if(dj.getMonth() === d.getMonth()) span++;
        else break;
      }
      mHtml += '<div class="grid-month" style="width:'+(span*pw)+'px;border-left:'+(i===0?'none':'1px solid var(--border)')+'">'+MON[d.getMonth()]+'</div>';
    }
    
    // Week label: 1-4 repeating
    const wkNum = (i % 4) + 1;
    wHtml += '<div class="grid-week'+(wkNum===1?' odd':'')+'" style="width:'+pw+'px;border-left:'+(i===0?'none':'1px solid var(--border)')+'">'+wkNum+'</div>';
  }
  
  mHtml += '</div>';
  wHtml += '</div>';
  hdr.innerHTML = mHtml + wHtml;
  
  // ── Task rows ──
  const rows = document.getElementById('gridRows');
  rows.innerHTML = '';
  
  if(tasks.length === 0){
    rows.innerHTML = '<div style="padding:80px 20px;text-align:center;color:var(--text2);font-size:.85rem">➕ Нажмите «Новая задача» или введите название выше</div>';
    stat();
    return;
  }
  
  tasks.forEach((t, i) => {
    // Row body
    const rw = document.createElement('div');
    rw.className = 'grid-row'+(i===sel?' selected':'');
    rw.dataset.idx = i;
    rw.style.width = tw + 'px';
    
    // Grid lines
    let g = '<div class="grid-lines">';
    for(let j=0;j<=w;j++){
      const l = j%4===0 ? ' border-left:1px solid var(--border)' : ' border-left:1px solid #f3f4f6';
      g += '<div class="grid-line" style="left:'+(j*pw)+'px;width:0'+l+'"></div>';
    }
    g += '</div>';
    
    rw.innerHTML = g;
    
    // Task bar — click selects, dblclick edits
    const bl = Math.max(0, Math.min(t.week, w-1)) * pw;
    const bw = Math.max(10, Math.min(t.span||1, w - t.week)) * pw - 2;
    const bar = document.createElement('div');
    bar.className = 'task-bar s-' + t.status;
    bar.style.cssText = 'left:'+bl+'px;width:'+bw+'px;background:'+(SC[t.status]||'#6366f1');
    bar.textContent = t.name;
    bar.dataset.idx = i;
    bar.onclick = e=>{e.stopPropagation();sk(i)};
    bar.ondblclick = e=>{e.stopPropagation();opEd(i)};
    rw.appendChild(bar);
    
    // Click on row (background) also selects
    rw.onclick = e=>{if(e.target===rw||e.target.classList.contains('grid-lines')||e.target.classList.contains('grid-line'))sk(i)};
    rw.ondblclick = e=>{if(e.target===rw)opEd(i)};
    
    rows.appendChild(rw);
  });
  
  stat();
}

function sk(i){
  if(i<0||i>=tasks.length) return;
  sel = i;
  // Remove all selected highlights
  document.querySelectorAll('.grid-row').forEach(el=>el.classList.remove('selected'));
  document.querySelectorAll('.task-bar').forEach(el=>el.style.outline='');
  // Highlight selected task bar
  const bar = document.querySelector('.task-bar[data-idx="'+i+'"]');
  if(bar) bar.style.outline = '2px solid #1a1a2e';
  document.getElementById('editBtn').disabled = false;
  document.getElementById('delBtn').disabled = false;
}

function stat(){
  const ts = {};
  tasks.forEach(t=>{ts[t.status]=(ts[t.status]||0)+1});
  let h='';
  Object.entries(ts).forEach(([k,v])=>{
    h+='<span style="display:inline-flex;align-items:center;gap:4px"><span style="width:8px;height:8px;border-radius:2px;background:'+(SC[k]||'#ccc')+'"></span> '+SL[k]+': '+v+'</span>';
  });
  document.getElementById('stats').innerHTML = h||'0 задач';
}

// ── Add ──
function addTask(n,st,wk,sp){
  if(!n||!n.trim()) return;
  const {w}=weekInfo();
  tasks.push({name:n.trim(),desc:'',status:st||'plan',week:Math.max(0,Math.min(wk||0,w-1)),span:Math.max(1,Math.min(sp||1,w))});
  sv(); render(); sk(tasks.length-1);
}

// ── Save/Load ──
function sv(){
  localStorage.setItem('mr2', JSON.stringify({
    tasks,
    title: document.getElementById('rpTitle').value,
    owner: document.getElementById('rpOwner').value
  }));
}
function ld(){
  try{const d=JSON.parse(localStorage.getItem('mr2'));if(d){tasks=d.tasks||[];if(d.title)document.getElementById('rpTitle').value=d.title;if(d.owner)document.getElementById('rpOwner').value=d.owner}}catch(e){}
}

// ── Events ──
document.getElementById('addBtn').onclick=()=>{document.getElementById('fName').focus();document.getElementById('fName').scrollIntoView({behavior:'smooth'})};
document.getElementById('editBtn').onclick=()=>{if(sel>=0&&sel<tasks.length)opEd(sel)};
document.getElementById('delBtn').onclick=()=>{if(sel<0)return;if(!confirm('Удалить «'+tasks[sel].name+'»?'))return;tasks.splice(sel,1);sel=-1;document.getElementById('editBtn').disabled=true;document.getElementById('delBtn').disabled=true;sv();render()};
document.getElementById('fAdd').onclick=()=>{const n=document.getElementById('fName').value.trim(),st=document.getElementById('fStatus').value,sp=parseInt(document.getElementById('fWeeks').value)||4,wk=parseInt(document.getElementById('fWeekSel').value)||0;if(!n)return;addTask(n,st,wk,sp);document.getElementById('fName').value='';document.getElementById('fName').focus()};
document.getElementById('fName').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('fAdd').click()});

function opEd(i){
  if(i<0||i>=tasks.length) return;
  ed=i;const t=tasks[i];
  document.getElementById('modalTitle').textContent='✏️ Редактировать';
  document.getElementById('mName').value=t.name;
  document.getElementById('mDesc').value=t.desc||'';
  fillSel(document.getElementById('mWeekSel'),t.week);
  document.getElementById('mSpan').value=t.span||1;
  document.getElementById('mStatus').value=t.status||'plan';
  document.getElementById('modal').style.display='flex';
  document.getElementById('mName').focus();document.getElementById('mName').select();
}
document.getElementById('mSave').onclick=()=>{if(ed<0)return;const n=document.getElementById('mName').value.trim();if(!n)return;tasks[ed].name=n;tasks[ed].desc=document.getElementById('mDesc').value.trim();tasks[ed].week=parseInt(document.getElementById('mWeekSel').value)||0;tasks[ed].span=parseInt(document.getElementById('mSpan').value)||1;tasks[ed].status=document.getElementById('mStatus').value;document.getElementById('modal').style.display='none';ed=-1;sv();render();if(sel>=0&&sel<tasks.length)sk(sel)};
document.getElementById('mCancel').onclick=()=>{document.getElementById('modal').style.display='none';ed=-1};

['rpTitle','rpOwner','zoomSel'].forEach(id=>{document.getElementById(id).addEventListener('change',()=>{sv();fillSel(document.getElementById('fWeekSel'),0);render()})});

document.getElementById('clearBtn').onclick=()=>{if(!confirm('Очистить всё?'))return;tasks=[];sel=-1;document.getElementById('editBtn').disabled=true;document.getElementById('delBtn').disabled=true;sv();render()};
document.getElementById('exampleBtn').onclick=()=>{
  tasks=[
    {name:'Аудит каналов',desc:'Сбор данных',status:'done',week:0,span:4},
    {name:'Стратегия лидогенерации',desc:'Определение каналов',status:'inprogress',week:4,span:4},
    {name:'Запуск Telegram-канала',desc:'Контент-план',status:'inprogress',week:6,span:6},
    {name:'SEO-оптимизация',desc:'Технический аудит',status:'plan',week:10,span:8},
    {name:'Внедрение CDP',desc:'Единая база',status:'plan',week:18,span:8},
    {name:'Автоматизация email',desc:'Триггеры',status:'plan',week:22,span:6},
    {name:'Ретаргетинг',desc:'По сегментам',status:'plan',week:28,span:6},
    {name:'Анализ эффективности',desc:'ROMI, CAC',status:'plan',week:36,span:6}
  ];
  sel=-1;sv();render();
};

document.getElementById('exPng').onclick=()=>{
  const el=document.getElementById('rmCard');
  if(typeof html2canvas==='undefined'){
    const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';s.onload=()=>{px(el)};document.body.appendChild(s)
  }else{px(el)}
};
function px(el){html2canvas(el,{backgroundColor:'#fff',scale:2,useCORS:true,logging:false,width:el.scrollWidth,height:el.scrollHeight}).then(c=>{const a=document.createElement('a');a.download='roadmap.png';a.href=c.toDataURL('image/png');a.click()})}
document.getElementById('exCsv').onclick=()=>{
  if(!tasks.length)return;
  let c='\uFEFFНазвание,Описание,Неделя,Длит(нед),Статус\n';
  tasks.forEach(t=>{const es=s=>'"'+String(s||'').replace(/"/g,'""')+'"';c+=es(t.name)+','+es(t.desc||'')+','+(t.week+1)+','+t.span+','+SL[t.status]+'\n'});
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:'text/csv;charset=utf-8'}));a.download='roadmap.csv';a.click()
};

document.addEventListener('keydown',e=>{
  if(document.getElementById('modal').style.display==='flex'){if(e.key==='Escape'){document.getElementById('modal').style.display='none';ed=-1}if(e.key==='Enter')document.getElementById('mSave').click();return}
  if(e.key==='ArrowDown'&&tasks.length>0){e.preventDefault();sel=Math.min(tasks.length-1,sel+1);sk(sel)}
  if(e.key==='ArrowUp'&&tasks.length>0){e.preventDefault();sel=Math.max(0,sel-1);sk(sel)}
  if(e.key==='Delete'&&sel>=0){e.preventDefault();if(!confirm('Удалить «'+tasks[sel].name+'»?'))return;tasks.splice(sel,1);sel=-1;document.getElementById('editBtn').disabled=true;document.getElementById('delBtn').disabled=true;sv();render()}
  if(e.key==='Enter'&&sel>=0){opEd(sel)}
});

function e(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

// ── Init ──
ld();
setTimeout(()=>{
  fillSel(document.getElementById('fWeekSel'),0);
  fillSel(document.getElementById('mWeekSel'),0);
  render();
  if(tasks.length===0) document.getElementById('exampleBtn').click();
},100);
</script>
